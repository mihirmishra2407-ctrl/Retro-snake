name: Build Retro Snake APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev gettext autopoint

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer "cython<3.4"

      - name: Build debug APK
        run: |
          buildozer -v android debug

      - name: Collect APK
        run: |
          mkdir -p dist
          find bin -type f -name '*.apk' -print -exec cp {} dist/ \;
          test -n "$(find dist -type f -name '*.apk' -print -quit)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Retro-Snake-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
